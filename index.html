<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTOBOT EXPEDITION // TELETRAAN-I AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --prime-blue: #0077ff;
            --prime-red: #d90429;
            --matrix-cyan: #00f0ff;
            --gold: #ffbe0b;
            --metal-bg: #05070c;
            --card-glass: rgba(14, 22, 38, 0.96);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--metal-bg);
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        #spark-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%),
                        radial-gradient(circle, transparent 65%, black 140%);
            background-size: 100% 4px, 100% 100%;
            pointer-events: none;
            z-index: 99;
        }

        .stage-container {
            position: absolute;
            width: 92vw;
            max-width: 780px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #stage-1 { z-index: 60; }

        .hidden-stage {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: scale(0.92);
        }

        .hud-btn {
            background: rgba(0, 119, 255, 0.2);
            border: 1px solid var(--matrix-cyan);
            color: #fff;
            padding: 10px 20px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            letter-spacing: 1.5px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
            transition: all 0.2s;
            margin-top: 10px;
        }
        .hud-btn:hover {
            background: var(--matrix-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--matrix-cyan);
        }
        .hud-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        /* Blast Doors */
        .door {
            position: fixed;
            top: 0;
            width: 50vw;
            height: 100vh;
            background: linear-gradient(135deg, #131926 0%, #080c14 100%);
            border-right: 3px solid var(--prime-blue);
            z-index: 50;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex;
            align-items: center;
        }
        #door-left { left: 0; }
        #door-right { right: 0; border-right: none; border-left: 3px solid var(--prime-blue); }
        .hazard-stripe {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 14px;
            background: repeating-linear-gradient(45deg, var(--gold), var(--gold) 15px, #111 15px, #111 30px);
        }
        .open-left { transform: translateX(-100%); }
        .open-right { transform: translateX(100%); }

        /* Stage 1: Tuner */
        .tuner-box {
            background: var(--card-glass);
            border: 2px solid var(--matrix-cyan);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 45px rgba(0, 240, 255, 0.35);
        }
        .freq-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            color: var(--gold);
            text-shadow: 0 0 15px var(--gold);
            margin: 15px 0;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 12px;
            background: rgba(0, 240, 255, 0.2);
            border-radius: 6px;
            outline: none;
            border: 1px solid var(--matrix-cyan);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 32px;
            height: 32px;
            background: var(--matrix-cyan);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 20px var(--matrix-cyan);
        }

        /* Stage 2: Star Map */
        .star-map-box {
            background: var(--card-glass);
            border: 2px solid var(--matrix-cyan);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
        }
        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 10px;
            margin-bottom: 16px;
        }
        .star-canvas-area {
            position: relative;
            width: 100%;
            height: 280px;
            border: 1px dashed rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            background: radial-gradient(circle, rgba(0, 119, 255, 0.12) 10%, transparent 80%);
            overflow: hidden;
        }
        .beacon {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--matrix-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: beaconPulse 2s infinite;
            transform: translate(-50%, -50%);
            background: rgba(0, 240, 255, 0.15);
        }
        .beacon.collected {
            border-color: var(--gold);
            background: rgba(255, 190, 11, 0.4);
            box-shadow: 0 0 15px var(--gold);
        }
        .beacon span { font-size: 0.85rem; font-weight: bold; color: #fff; font-family:'Orbitron'; }
        @keyframes beaconPulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7); }
            70% { box-shadow: 0 0 0 16px rgba(0, 240, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 80;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content {
            background: #0d1522;
            border: 2px solid var(--gold);
            border-radius: 10px;
            padding: 26px; max-width: 480px; width: 90%; text-align: center;
            box-shadow: 0 0 35px rgba(255, 190, 11, 0.3);
        }

        /* Stage 3: Quiz */
        .quiz-box {
            background: var(--card-glass);
            border: 2px solid var(--matrix-cyan);
            border-radius: 12px;
            padding: 30px; width: 100%; text-align: center;
        }
        .quiz-options { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .option-btn {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #fff; padding: 14px 18px; border-radius: 6px;
            font-size: 1.05rem; cursor: pointer; text-align: left; transition: all 0.2s;
        }
        .option-btn:hover { background: rgba(0, 240, 255, 0.25); border-color: var(--matrix-cyan); transform: translateX(6px); }

        /* Stage 4: Matrix */
        .matrix-unlatch-box {
            background: var(--card-glass);
            border: 2px solid var(--matrix-cyan);
            border-radius: 12px; padding: 36px 30px; text-align: center; width: 100%;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
        }
        .matrix-core-artifact {
            width: 220px; height: 140px; margin: 20px auto; position: relative; cursor: pointer; transition: transform 0.2s ease;
        }
        .matrix-core-artifact:hover { transform: scale(1.08); }

        /* Stage 5: Optimus & AI Chat */
        .optimus-scene {
            display: flex; flex-direction: column; align-items: center; width: 100%;
            transform-style: preserve-3d; transition: transform 0.2s ease-out;
        }
        .optimus-head-wrapper {
            width: 240px; height: 170px; margin-bottom: -32px; z-index: 5;
            filter: drop-shadow(0 0 25px rgba(0, 119, 255, 0.5));
            animation: floatPrime 4s ease-in-out infinite alternate;
        }
        @keyframes floatPrime { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }

        .speaking-optics { animation: opticFlicker 0.12s infinite alternate; }
        @keyframes opticFlicker {
            0% { opacity: 0.4; filter: drop-shadow(0 0 2px #00f0ff); }
            100% { opacity: 1; filter: drop-shadow(0 0 12px #fff); }
        }

        .card-stage {
            position: relative; width: 100%;
